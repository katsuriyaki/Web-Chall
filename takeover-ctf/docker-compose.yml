version: '3.8'

services:
  web:
    image: nginx:alpine
    container_name: cyscom-takeover
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./html/futurevera:/var/www/html/futurevera:ro
      - ./html/blog:/var/www/html/blog:ro
      - ./html/support:/var/www/html/support:ro
      - ./html/secret:/var/www/html/secret:ro
    restart: unless-stopped
    networks:
      - ctfnet

networks:
  ctfnet:
    driver: bridge
